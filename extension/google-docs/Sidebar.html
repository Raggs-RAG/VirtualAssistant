<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root {
    --bg: #09090b; --ink: #f4efe6; --dim: #a09a8e;
    --gold: #e8a33d; --gold2: #f5c26b; --line: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    padding: 18px 14px; font-size: 14px;
  }
  h1 {
    font-size: 18px; letter-spacing: 0.05em; margin-bottom: 4px;
    text-transform: uppercase; font-weight: 800;
  }
  h1 .lm { color: var(--gold); }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  label { display: block; color: var(--gold); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.2em; margin: 14px 0 6px; }
  select {
    width: 100%; padding: 10px; background: #141416; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; font-family: inherit;
  }
  button.run {
    width: 100%; margin-top: 18px; padding: 14px;
    background: linear-gradient(100deg, var(--gold), var(--gold2));
    color: #17120a; border: none; border-radius: 999px;
    font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
    cursor: pointer; font-family: inherit; font-size: 13px;
  }
  button.run:disabled { opacity: 0.4; cursor: wait; }
  .status { margin-top: 14px; color: var(--dim); font-size: 12px; }
  .error { margin-top: 14px; color: #e05c4f; font-size: 12px; }
  audio { width: 100%; margin-top: 14px; }
  details { margin-top: 14px; }
  summary { color: var(--dim); cursor: pointer; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.1em; }
  pre { white-space: pre-wrap; font-family: inherit; font-size: 13px;
    line-height: 1.7; margin-top: 10px; color: var(--ink); }
  a { color: var(--gold); }
</style>
</head>
<body>
  <h1>Culture<span class="lm">LM</span></h1>
  <div class="sub">Run this doc through the culture.</div>

  <label>Show</label>
  <select id="show">
    <option value="roundtable">The Roundtable — industry, hot takes</option>
    <option value="read">Spill SZN — snark and shade</option>
    <option value="throughline">The Through-Line — history, receipts</option>
    <option value="morningrush">Morning Rush — provocative, community</option>
    <option value="game">Game Recognize Game — street wisdom</option>
    <option value="stream">The Stream — livestream chaos</option>
    <option value="pourup">Pour Up — loud and legendary</option>
  </select>

  <button id="go" class="run">Run the Breakdown</button>
  <div id="status" class="status"></div>
  <div id="error" class="error"></div>
  <div id="player"></div>
  <details id="transcriptBox" style="display:none">
    <summary>Read the transcript</summary>
    <pre id="transcript"></pre>
  </details>

<script>
  var go = document.getElementById('go');
  var statusEl = document.getElementById('status');
  var errEl = document.getElementById('error');

  go.addEventListener('click', function () {
    var archetypeId = document.getElementById('show').value;
    go.disabled = true;
    errEl.textContent = '';
    document.getElementById('player').innerHTML = '';
    document.getElementById('transcriptBox').style.display = 'none';
    statusEl.textContent = 'Writing the episode...';

    google.script.run
      .withSuccessHandler(function (data) {
        document.getElementById('transcript').textContent = data.script;
        document.getElementById('transcriptBox').style.display = 'block';
        statusEl.textContent = 'In the booth — recording audio...';
        google.script.run
          .withSuccessHandler(function (audio) {
            statusEl.textContent = '';
            go.disabled = false;
            if (audio.tooBig) {
              document.getElementById('player').innerHTML =
                '<div class="status">Episode too long for the sidebar — ' +
                '<a href="' + audio.webUrl + '" target="_blank">open CultureLM</a> for full audio.</div>';
              return;
            }
            var el = document.createElement('audio');
            el.controls = true;
            el.src = audio.dataUrl;
            document.getElementById('player').appendChild(el);
            el.play().catch(function () {});
          })
          .withFailureHandler(function (e) {
            statusEl.textContent = '';
            go.disabled = false;
            errEl.textContent = e.message;
          })
          .generateAudio(data.script, archetypeId, 'public');
      })
      .withFailureHandler(function (e) {
        statusEl.textContent = '';
        go.disabled = false;
        errEl.textContent = e.message;
      })
      .generateScript(archetypeId, 'public');
  });
</script>
</body>
</html>
